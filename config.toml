baseURL = "https://michalberg.cz/"
languageCode = "cs-cz"
title = "Michal Berg - archiv článků, komentáře, kontakty"
theme = "PaperMod"
canonifyURLs = true
relativeURLs = false

# Zachování jednoduché URL struktury jako v WordPressu
[permalinks]
  posts = "/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  description = "Osobní web Michala Berga - články, komentáře, archiv a kontakty"
  author = "Michal Berg"
  disableSpecial1stPost = true
  mainSections = ["posts"]
  images = ["/og-image.jpg"]

  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"

  # ProfileMode VYPNUTÝ - chceme články na homepage
  [params.profileMode]
    enabled = false
  
  # Sociální sítě
  [[params.socialIcons]]
    name = "facebook"
    url = "https://facebook.com/michalberg"
  
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/michalberg"
  
  [[params.socialIcons]]
    name = "instagram"
    url = "https://instagram.com/michalberg"
  
  [[params.socialIcons]]
    name = "Bluesky"
    url = "https://bsky.app/profile/michalberg.cz"

  # Homepage nastavení
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = false
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = false
  ShowWordCount = false
  ShowAllPagesInArchive = true

[taxonomies]
  tag = "tags"
  category = "categories"
  source = "sources"

[menu]
  [[menu.main]]
    identifier = "o-mne"
    name = "O mně"
    url = "/pages/o-mne/"
    weight = 10
  
  [[menu.main]]
    identifier = "podcasty"
    name = "Podcasty"
    url = "/podcasty/"
    weight = 15

  [[menu.main]]
    identifier = "archiv"
    name = "Archiv"
    url = "/archiv/"
    weight = 20

[outputs]
  home = ["HTML", "RSS", "JSON"]
